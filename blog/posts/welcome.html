  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      initPage({
        title: "Welcome to laughing-dragons.com",
        description: "Welcome to laughing-dragons.com - the master hub for Laughing Dragons Productions.",
        activePath: "/blog/",
        content: `
          <article class="prose reveal">
            <p class="pillar-eyebrow">July 28, 2026</p>
            <h1>Welcome to laughing-dragons.com</h1>
            <p>Every Laughing Dragons project now has a home base. This site ties together free browser games, studio news, learning tools, our Lit Printz shop partnership, 3D prints, laser work, and the stories we tell from the workroom floor.</p>
            <p>If you found us through a single tool, a YouTube clip, or a dragon sweatshirt - start here. The hub is designed so you can see everything we make without hunting across a dozen links.</p>
            <h2>What you will find here</h2>
            <p>The <a href="/games/">Games hub</a> is where you play free browser titles - Terminal Trainer, Memory Matching, Fruit Search, and more. Our <a href="/news/">News</a> desk points to The Associated Guess, the official news studio of Laughing Dragons Productions. Our <a href="/tools/">free tools</a> run entirely in the browser - no signup, no uploads - because we use them ourselves when we are learning new stacks and teaching friends.</p>
            <p>The <a href="/shop/">shop section</a> sends you to <a href="https://litprintz.com" target="_blank" rel="noopener noreferrer">Lit Printz</a> for checkout and the full product catalog, while <a href="/prints/">3D prints</a> and <a href="/laser/">laser engraving</a> show what is coming off the bench.</p>
            <h2>Why one site matters</h2>
            <p>We are a small studio. Splitting every project across unrelated URLs made it hard for people to understand that the games, the news desk, the tools, and the merch all come from the same workroom. laughing-dragons.com fixes that: one brand story, one navigation bar, one place to contact us.</p>
            <p>We will keep posting here as we ship new games, tools, and shop drops. Thanks for stopping by - explore the pillars on the <a href="/">home page</a> and say hello through <a href="/contact/">Contact Us</a> if you have questions.</p>
            <p><a href="/">&larr; Back to home</a></p>
          </article>
        `,
      });
    </script>
  </body>
</html>
