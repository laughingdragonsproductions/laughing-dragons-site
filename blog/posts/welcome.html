        content: `
          <article class="prose reveal">
            <p class="pillar-eyebrow">July 28, 2026</p>
            <h1>Welcome to laughing-dragons.com</h1>
            <p>Every Laughing Dragons project now has a home base. This site ties together our kids show, free learning tools, apps, Shopify and Etsy shops, 3D prints, laser work, and the stories we tell from the workroom floor.</p>
            <p>If you found us through a single tool, a YouTube clip, or a dragon sweatshirt — start here. The hub is designed so you can see everything we make without hunting across a dozen links.</p>
            <h2>What you will find here</h2>
            <p>The <a href="/kids/">Kids Show hub</a> is where Fruit Friends live: episodes, A–Z characters, printable files, and browser games that teach letters without feeling like homework. Our <a href="/tools/">free tools</a> run entirely in the browser — no signup, no uploads — because we use them ourselves when we are learning new stacks and teaching friends.</p>
            <p>The <a href="/shop/">shop section</a> points to Etsy and Shopify listings, while <a href="/prints/">3D prints</a> and <a href="/laser/">laser engraving</a> show what is coming off the bench. Apps like DRI and Dragon Gems link out from <a href="/apps/">/apps/</a> when you are ready to go deeper.</p>
            <h2>Why one site matters</h2>
            <p>We are a small studio. Splitting every project across unrelated URLs made it hard for people to understand that the kids show, the tools, and the merch all come from the same workroom. laughing-dragons.com fixes that: one brand story, one navigation bar, one place to contact us.</p>
            <p>We will keep posting here as we ship new episodes, tools, and shop drops. Thanks for stopping by — explore the pillars on the <a href="/">home page</a> and say hello through <a href="/contact/">Contact Us</a> if you have questions.</p>
            <p><a href="/">&larr; Back to home</a></p>
          </article>
        `,
