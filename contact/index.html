<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Laughing Dragons Productions." />
    <title>Contact</title>
    <link rel="icon" href="/assets/brand/ldp-logo.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://laughing-dragons.com/contact/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048606415692002"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      const cfg = window.SITE_CONFIG;
      initPage({
        title: "Contact",
        description: "Contact Laughing Dragons Productions.",
        activePath: "/contact/",
        content: `
          <header class="page-header reveal">
            <p class="pillar-eyebrow">Get in touch</p>
            <h1>Contact</h1>
            <p>Questions about orders, the kids show, apps, or collaborations — reach us by email.</p>
          </header>
          <div class="prose reveal">
            <ul class="meta-list">
              <li><strong>Email</strong> — <a href="mailto:${cfg.contactEmail}">${cfg.contactEmail}</a></li>
              <li><strong>Shop</strong> — <a href="/shop/">Store links</a></li>
              <li><strong>Orders</strong> — Use the email on your Etsy or Shopify receipt for order-specific help</li>
            </ul>
          </div>
        `,
      });
    </script>
  </body>
</html>
