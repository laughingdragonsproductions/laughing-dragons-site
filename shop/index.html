<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shop Laughing Dragons Productions — Etsy, Shopify apparel, 3D prints, digital files, and Printful-backed shipping." />
    <title>Shop</title>
    <link rel="icon" href="/assets/brand/ldp-logo.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://laughing-dragons.com/shop/" />
</head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      const cfg = window.SITE_CONFIG;
      initPage({
        title: "Shop",
        description: "Shop Laughing Dragons Productions — Etsy, Shopify apparel, 3D prints, digital files, and Printful-backed shipping.",
        activePath: "/shop/",
        content: `
          <header class="page-header reveal">
            <p class="pillar-eyebrow">Inside the workroom</p>
            <h1>Shop the floor</h1>
            <p>3D prints, apparel, and maker gear from our floor to yours. Order through our storefronts — fulfillment and shipping handled by our production partners.</p>
          </header>
          <section class="link-grid reveal">
            <a class="link-card" href="/prints/">
              <h2>3D Print Catalog</h2>
              <p>Coolers, coozies, and sellable prints from the workroom — browse designs before you buy.</p>
            </a>
            <a class="link-card" href="/laser/">
              <h2>Laser Engraving</h2>
              <p>Glowforge Pro HD cut and engraved signs, gifts, coasters, and personalized pieces from the floor.</p>
            </a>
            <a class="link-card" href="${cfg.links.shopify}" target="_blank" rel="noopener">
              <h2>Shopify Store</h2>
              <p>Primary storefront for apparel, prints, and maker gear. Custom domain: laughingdragonsproductions.com when attached.</p>
            </a>
            <a class="link-card" href="${cfg.links.etsy}" target="_blank" rel="noopener">
              <h2>Etsy — LaughingDragonsForge</h2>
              <p>Handpicked merch and POD items on Etsy. Great for one-off gifts and maker favorites.</p>
            </a>
          </section>
          <div class="prose reveal">
            <h2>3D printing &amp; files</h2>
            <p>Our workroom bench runs custom 3D prints and a Glowforge Pro HD for laser cut and engraved gifts. Browse the <a href="/prints/">print catalog</a> or <a href="/laser/">laser engraving</a> page, or order through our stores when live.</p>
            <h2>Shipping</h2>
            <p>Apparel and select merch ship through Printful with tracking. Custom 3D print orders ship from our workroom once production is complete. You'll receive updates by email after checkout.</p>
          </div>
        `,
      });
    </script>
  </body>
</html>
