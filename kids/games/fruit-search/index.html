<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fruit Search — an I-Spy style Where's Waldo game. Find Fruit Friends hidden in busy maps. Unlocked by beating par on Memory Matching."
    />
    <title>Fruit Search — Unlocked</title>
    <link rel="icon" href="/assets/brand/ldp-logo.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://laughing-dragons.com/kids/games/fruit-search/" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048606415692002"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/kids-unlocks.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      const unlocked = window.KIDS_UNLOCKS?.isFruitSearchUnlocked?.();

      if (!unlocked) {
        window.location.replace("/kids/games/memory-matching/");
      } else {
        initPage({
          title: "Fruit Search — Unlocked",
          description: "You unlocked Fruit Search by beating par on Memory Matching.",
          activePath: "/kids/",
          content: `
            <header class="page-header reveal">
              <p class="pillar-eyebrow">Kids games · Unlocked</p>
              <h1>Fruit Search</h1>
              <p class="lede">You beat par on Memory Matching — this game is unlocked for you. The full I-Spy build is coming next.</p>
            </header>
            <div class="prose reveal">
              <p><span class="status-tag status-unlocked">Unlocked</span> Scan busy maps and find the Fruit Friend the game asks for — like Where's Waldo for the A–Z cast.</p>
              <p>We are building the playable Fruit Search here. Until then, explore <a href="/kids/#characters">Fruit Friends characters</a> or play <a href="/kids/games/memory-matching/">Memory Matching</a> again.</p>
              <p><a href="/kids/#games">&larr; All Kids games</a></p>
            </div>
          `,
        });
      }
    </script>
  </body>
</html>
