<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Memory Matching Game — unlocked by beating Terminal Trainer on Laughing Dragons Kids." />
    <title>Memory Matching — Unlocked</title>
    <link rel="icon" href="/assets/brand/ldp-logo.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://laughing-dragons.com/kids/games/memory-matching/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048606415692002"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/kids-unlocks.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      const unlocked = window.KIDS_UNLOCKS?.isMemoryMatchingUnlocked?.();
      const rewards = window.KIDS_REWARDS?.terminalTrainer || {};
      const shopUrl = window.KIDS_REWARDS?.getShopUrl?.() || "/shop/";

      if (!unlocked) {
        window.location.replace("/kids/games/terminal/");
      } else {
        initPage({
          title: "Memory Matching — Unlocked",
          description: "You unlocked Memory Matching by beating Terminal Trainer.",
          activePath: "/kids/",
          content: `
            <header class="page-header reveal">
              <p class="pillar-eyebrow">Kids games · Unlocked</p>
              <h1>Memory Matching Game</h1>
              <p class="lede">You beat Terminal Trainer — this game is unlocked for you. The full matching game is still being built.</p>
            </header>
            <div class="prose reveal">
              <p><span class="status-tag status-unlocked">Unlocked</span> Your unlock code: <strong>${rewards.gameUnlockCode || "FORGE-GATE-7"}</strong></p>
              <p>Store reward still active: <strong>${rewards.couponCode || "DragonForge15"}</strong> — ${rewards.couponLabel || "15% off anything in-store"} at the <a href="${shopUrl}">Laughing Dragons shop</a>.</p>
              <p>We will drop the playable Memory Matching build here when it is ready. Until then, explore <a href="/kids/#characters">Fruit Friends characters</a> or play <a href="/kids/games/terminal/">Terminal Trainer</a> again.</p>
              <p><a href="/kids/#games">&larr; All Kids games</a></p>
            </div>
          `,
        });
      }
    </script>
  </body>
</html>
