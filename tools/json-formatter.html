<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pretty-print, minify, and validate JSON in your browser." />
    <title>JSON Formatter</title>
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://laughing-dragons.com/tools/json-formatter.html" />
    <link rel="icon" href="/assets/brand/ldp-logo.png" type="image/png" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048606415692002"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/tools.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      initToolPage({
        title: "JSON Formatter",
        description: "Pretty-print, minify, and validate JSON in your browser.",
        content: `
          <section class="tool-panel">
            <h1>JSON Formatter</h1>
            <p class="lede">Validate, pretty-print, or minify JSON without uploading it anywhere.</p>
            <label for="input">JSON</label>
            <textarea id="input" placeholder='{"hello":"world"}'></textarea>
            <div style="margin-top:1rem;display:flex;gap:0.5rem;flex-wrap:wrap">
              <button type="button" id="pretty">Pretty print</button>
              <button type="button" id="minify" class="secondary">Minify</button>
            </div>
            <div id="result" class="result" aria-live="polite"></div>
          </section>
        `,
      });

      function parseInput() {
        return JSON.parse(document.getElementById("input").value);
      }

      function show(text, isError) {
        const el = document.getElementById("result");
        el.textContent = text;
        el.classList.toggle("error", !!isError);
      }

      document.getElementById("pretty").addEventListener("click", () => {
        try {
          show(JSON.stringify(parseInput(), null, 2), false);
        } catch (e) {
          show(`Invalid JSON: ${e.message}`, true);
        }
      });

      document.getElementById("minify").addEventListener("click", () => {
        try {
          show(JSON.stringify(parseInput()), false);
        } catch (e) {
          show(`Invalid JSON: ${e.message}`, true);
        }
      });
    </script>
  </body>
</html>
