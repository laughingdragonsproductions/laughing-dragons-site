<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Count syllables per line for lyrics, poetry, and songwriting — runs in your browser." />
    <title>Syllable Counter</title>
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://laughing-dragons.com/tools/syllable-counter.html" />
    <link rel="icon" href="/assets/brand/ldp-logo.png" type="image/png" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048606415692002"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/tools.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      initToolPage({
        title: "Syllable Counter",
        description: "Count syllables per line for lyrics, poetry, and songwriting — runs in your browser.",
        content: `
          <section class="tool-panel">
            <h1>Syllable Counter</h1>
            <p class="lede">Paste text to append a syllable count to each line. Uses the same vowel-group heuristic as our desktop lyrics script.</p>
            <label for="text">Your text</label>
            <textarea id="text" placeholder="Paste or type lyrics, poetry, or lines here..."></textarea>
            <div class="field-grid two" style="margin-top:1rem">
              <div>
                <label for="output">With syllable counts</label>
                <textarea id="output" readonly aria-readonly="true"></textarea>
              </div>
              <div id="summary" class="result" aria-live="polite">Total syllables: 0\nLines: 0</div>
            </div>
          </section>
        `,
      });

      function update() {
        const text = document.getElementById("text").value;
        const result = countTextSyllables(text);
        document.getElementById("output").value = result.formatted;
        document.getElementById("summary").textContent =
          `Total syllables: ${result.total}\nLines: ${result.lines}`;
      }

      document.getElementById("text").addEventListener("input", update);
      update();
    </script>
  </body>
</html>
