<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Count words, characters, sentences, and estimated reading time." />
    <title>Word Counter</title>
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://laughing-dragons.com/tools/word-counter.html" />
    <link rel="icon" href="/assets/brand/ldp-logo.png" type="image/png" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048606415692002"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/tools.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      initToolPage({
        title: "Word Counter",
        description: "Count words, characters, sentences, and estimated reading time.",
        content: `
          <section class="tool-panel">
            <h1>Word Counter</h1>
            <p class="lede">Paste text to see counts and a reading-time estimate.</p>
            <label for="text">Your text</label>
            <textarea id="text" placeholder="Paste or type text here..."></textarea>
            <div id="result" class="result" aria-live="polite" style="margin-top:1rem">Words: 0\nCharacters: 0\nSentences: 0\nReading time: 0 min</div>
          </section>
        `,
      });

      function count() {
        const text = document.getElementById("text").value;
        const trimmed = text.trim();
        const words = trimmed ? trimmed.split(/\s+/).length : 0;
        const chars = text.length;
        const sentences = trimmed ? (trimmed.match(/[.!?]+(\s|$)/g) || []).length || 1 : 0;
        const readingMin = Math.max(1, Math.ceil(words / 200));
        document.getElementById("result").textContent =
          `Words: ${words}\nCharacters: ${chars}\nSentences: ${sentences}\nReading time: ~${words ? readingMin : 0} min`;
      }

      document.getElementById("text").addEventListener("input", count);
      count();
    </script>
  </body>
</html>
