<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Laughing Dragons Productions - free browser games, studio news, learning tools, shop, 3D prints, and maker gear from the workroom." />
    <title>Laughing Dragons Productions</title>
    <link rel="icon" href="/assets/brand/ldp-logo.png" type="image/png" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="canonical" href="https://laughing-dragons.com/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048606415692002"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/site.js"></script>
    <script>
      initPage({
        title: "Laughing Dragons Productions",
        description: "Free browser games, studio news, learning tools, shop, and maker gear from Laughing Dragons Productions.",
        activePath: "/",
        hero: true,
        adSlots: false,
        content: `
          <div class="pillars" id="explore">
            ${renderPillar({
              id: "games",
              eyebrow: "Free games",
              title: "Play in your browser",
              body: "New: Count the Dragons, Typing Race, and Hangman Lite - always open in your browser. Plus Terminal Trainer, Memory Matching, and more on the Games hub. No download, no account.",
              href: "/games/",
              cta: "Play games",
              image: "/assets/kids/games/terminal/desk-monitor-frame.png",
            })}
            ${renderPillar({
              id: "news",
              eyebrow: "News studio",
              title: "The Associated Guess",
              body: "TAG is the official news arm of Laughing Dragons Productions - written stories, newsroom coverage, and interview lives that land on YouTube.",
              href: "/news/",
              cta: "Open News",
              reverse: true,
            })}
            ${renderPillar({
              id: "tools",
              eyebrow: "Free Tools",
              title: "Online tools for learning",
              body: "Free browser utilities on laughing-dragons.com/tools - converters, formatters, calculators, and generators. No signup, no uploads.",
              href: "/tools/",
              cta: "Browse free tools",
            })}
            ${renderPillar({
              id: "shop",
              eyebrow: "Shop",
              title: "Buy at Lit Printz",
              body: "Laughing Dragons and Lit Printz are full partners. Browse the full catalog and check out at litprintz.com - one storefront for the whole shop.",
              href: "/shop/",
              cta: "Shop Lit Printz",
              reverse: true,
            })}
            ${renderPillar({
              id: "prints",
              eyebrow: "3D & Shipping",
              title: "Prints, files, and fulfillment",
              body: "Custom 3D prints from our bench, digital files where offered, and reliable shipping through our POD partners. Made in the Laughing Dragons workroom.",
              href: "/prints/",
              cta: "Browse 3D prints",
            })}
            ${renderPillar({
              id: "laser",
              eyebrow: "Laser Engraving",
              title: "Glowforge cut & engraved gifts",
              body: "Our Glowforge Pro HD is live on the floor - custom signs, coasters, nursery decor, keychains, and personalized maker pieces. Shop listings go live as we post them.",
              href: "/laser/",
              cta: "See laser engraving",
              reverse: true,
            })}
          </div>
        `,
      });
    </script>
  </body>
</html>
